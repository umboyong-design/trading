services:
  - type: web
    name: trading-pulse-kr-us
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.9
